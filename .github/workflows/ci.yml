name: Verify data, model and site

# This workflow is the build gate the brief asks for: a number cannot reach the published
# site unless it is reproducible from the committed snapshots and carries a source.
# Deploy (pages.yml) publishes whatever is on main, so main should only ever receive
# commits that pass here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-official:
    # This runner has open egress; the build sandbox does not. It is the only place in the
    # pipeline that can reach the official NBA endpoints, so the official player-statistics
    # snapshot is fetched here.
    #
    # The result is NOT committed by this job. It is pushed to a side branch
    # `ci-data/official-snapshots`, from where a session can review it and merge it by hand.
    # A snapshot therefore reaches the published site only after it has been looked at.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch the official player-statistics snapshot
        id: refresh
        continue-on-error: true
        run: |
          set +e
          python tools/refresh_player_stats.py --out "data/raw/player_stats_$(date -u +%F).json" \
            2>&1 | tee data/raw/player_stats_fetch_log.txt
          echo "exit=${PIPESTATUS[0]}" >> data/raw/player_stats_fetch_log.txt
          exit 0
      - name: Publish the snapshot to a review branch
        # Always publishes at least the fetch log, so a failed fetch is visible as a
        # failure rather than as silence. `git add` is given one pathspec at a time on
        # purpose: a single non-matching glob makes the whole `git add` fail, which
        # silently produced an empty commit the first time this ran.
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="ci-data/official-snapshots"
          git checkout -B "$BR"
          for f in data/raw/player_stats_fetch_log.txt data/raw/player_stats_*.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "::error::no fetch log was produced at all"
            exit 1
          fi
          git commit -m "ci: official player-statistics snapshot fetched $(date -u +%FT%TZ)"
          git push --force origin "$BR"
          echo "published to $BR"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Model + pipeline tests (stdlib unittest, no dependencies)
        run: python -m unittest discover -s nba2/tests -t . -v

      - name: Verify the sealed prediction ledger (never rewrite it)
        run: python -m nba2.pipeline.seal_predictions --verify

      - name: Rebuild site data and HTML
        run: python -m nba2.pipeline.build_site_data && python -m nba2.pipeline.build_site

      - name: Provenance gate (every row sourced, every blank flagged, no broken links)
        run: python -m nba2.pipeline.lint

      - name: Fail if the committed site does not match a rebuild of the committed data
        run: |
          git add -A
          if ! git diff --cached --quiet -- data/raw/ledger; then
            echo "::error::a sealed ledger changed during verification — the seal must be immutable"; exit 1
          fi
          if ! git diff --cached --quiet -- data/site.json; then
            echo "::error::data/site.json differs from a rebuild of data/raw — commit the rebuild"; exit 1
          fi
          if ! git diff --cached --quiet -- '*.html'; then
            echo "::error::the HTML does not match a rebuild of data/site.json — commit the rebuild"; exit 1
          fi
          echo "published artefacts match the pipeline"

      - name: Sealed predictions digest
        run: |
          for f in data/raw/ledger/sealed-*.json; do
            python - "$f" <<'PYEOF'
          import json, pathlib, sys
          d = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print("sealed", d["header"]["n_predictions"], d["header"]["sha256"], sys.argv[1])
          PYEOF
          done

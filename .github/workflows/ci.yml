name: Verify data, model and site

# This workflow is the build gate the brief asks for: a number cannot reach the published
# site unless it is reproducible from the committed snapshots and carries a source.
# Deploy (pages.yml) publishes whatever is on main, so main should only ever receive
# commits that pass here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Model + pipeline tests (stdlib unittest, no dependencies)
        run: python -m unittest discover -s nba2/tests -t . -v

      - name: Verify the sealed prediction ledgers (never rewrite them)
        run: |
          for f in data/raw/ledger/sealed-*.json; do
            python -c "from nba2.models import ledger as LD; import json, pathlib, sys; p = pathlib.Path('$f'); ok, stored, recomp = LD.verify(p); d = json.loads(p.read_text()); print('seal', d['header']['n_predictions'], stored[:16], 'VERIFIED' if ok else 'BROKEN'); sys.exit(0 if ok else 1)"
          done

      - name: Rebuild site data and HTML
        run: python -m nba2.pipeline.build_site_data && python -m nba2.pipeline.build_site

      - name: Provenance gate (every row sourced, every blank flagged, no broken links)
        run: python -m nba2.pipeline.lint

      - name: Stage the published tree (fails on any broken internal link)
        run: python -m nba2.pipeline.build_public --out _site

      - name: Fail if the committed site does not match a rebuild of the committed data
        run: |
          git add -A
          if ! git diff --cached --quiet -- data/raw/ledger; then
            echo "::error::a sealed ledger changed during verification — the seal must be immutable"; exit 1
          fi
          if ! git diff --cached --quiet -- data/site.json data/site-built.json; then
            echo "::error::data/site.json differs from a rebuild of data/raw — commit the rebuild"; exit 1
          fi
          if ! git diff --cached --quiet -- '*.html'; then
            echo "::error::the HTML does not match a rebuild of data/site.json — commit the rebuild"; exit 1
          fi
          echo "published artefacts match the pipeline"

  backtest:
    # The measured-skill report (backtest/) is a separate, self-contained tree. It is gated
    # here so that a published number cannot drift from the committed official snapshots.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backtest tests (leakage, estimators, reward gating, no market claims)
        run: python -m unittest discover -s backtest/tests -t . -v

      - name: Rebuild the measured-skill report
        run: python -m backtest.engine.build

      - name: Report verification (source per row, links, placeholders, determinism)
        run: python3 tools/verify_backtest.py

      - name: Fail if the committed report does not match a rebuild
        run: |
          git add -A
          if ! git diff --cached --quiet -- backtest/; then
            echo "::error::backtest/ differs from a rebuild of data/raw/history — commit the rebuild"; exit 1
          fi
          echo "backtest artefacts match the pipeline"

      - name: Sealed predictions digest
        run: |
          for f in data/raw/ledger/sealed-*.json; do
            python -c "import json,pathlib; d=json.loads(pathlib.Path('$f').read_text()); print('sealed', d['header']['n_predictions'], d['header']['sha256'])"
          done

name: Ingest official NBA snapshots

# Why this workflow exists
# -----------------------
# Every audit of this repository has landed on the same blocker: the published slate and injury
# data are a dated snapshot, because no automated ingestion exists, and `nba.com` /
# `ak-static.cms.nba.com` / `cdn.nba.com` / `stats.nba.com` were all unreachable from the
# environment where the data was assembled. Nobody had ever measured whether that unreachability is
# a property of *that environment* or of the endpoints. This workflow measures it, on the same
# runner class that would have to run any real ingestion.
#
# Safety properties, in order of importance
# ----------------------------------------
# 1. It never writes to a branch by itself. `probe` is read-only; `capture` writes only to an
#    artefact. A pull request is opened only when someone asks for it explicitly.
# 2. It fails CLOSED rather than open: an endpoint that does not answer produces no snapshot, so
#    the site can never publish a value that came from a partially-read document.
# 3. It publishes nothing. The GitHub Pages workflow is untouched, so a failed or empty ingest run
#    cannot change what the live site shows.
# 4. One request per endpoint per run, identifying User-Agent, no retries, 10-minute ceiling.

on:
  schedule:
    # 18:35 UTC = 13:35 ET, i.e. after the 13:00 ET injury-report cadence that the site's own
    # source register documents. The nightly run is a probe, not a publish.
    - cron: "35 18 * * *"
  workflow_dispatch:
    inputs:
      run_capture:
        description: "Also fetch and validate snapshots (artefact only; nothing is committed)"
        type: boolean
        default: false
      open_draft_pr:
        description: "Open a DRAFT pull request with the captured snapshots for human integration"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nba-ingest
  cancel-in-progress: false

jobs:
  probe:
    name: Probe official endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      any_reachable: ${{ steps.probe.outputs.any_reachable }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe each official endpoint (records status, bytes, sha256 — parses nothing)
        id: probe
        run: |
          python tools/ingest_official.py --probe --json ingest-report.json | tee probe-stdout.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          rep = json.loads(pathlib.Path("ingest-report.json").read_text())
          s = rep["summary"]
          print(f"any_reachable={'yes' if s['reachable'] else 'no'}")
          PY
        env:
          PYTHONUNBUFFERED: "1"

      - name: Record the answer in the run summary
        if: always()
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          rep = json.loads(pathlib.Path("ingest-report.json").read_text())
          print("## Official-source reachability, measured from a GitHub-hosted runner")
          print("")
          print(f"Run: {rep['run_at_utc']} · runner: {rep['runner'].get('github_runner_name') or rep['runner'].get('platform')}")
          print("")
          print("| endpoint | HTTP | bytes | sha256 (first 12) | error |")
          print("|---|---|---|---|---|")
          for k, v in rep["endpoints"].items():
              sha = (v.get("sha256") or "")[:12] or "—"
              print(f"| {k} | {v['http_status'] if v['http_status'] is not None else 'no response'} | "
                    f"{v['bytes']} | {sha} | {v.get('error') or ''} |")
          print("")
          r = rep["summary"]["reachable"]
          if r:
              print(f"**Reachable from a runner:** {', '.join(r)}. Unattended ingestion is therefore "
                    "buildable; the blocker was the build environment, not the league's CDN.")
          else:
              print("**Nothing answered from a runner either.** The blocker is the endpoint's policy toward "
                    "datacenter traffic, so no scheduled job here can refresh the site; a licensed feed or a "
                    "human-verified capture is the only honest path forward.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: probe-report-${{ github.run_id }}
          path: |
            ingest-report.json
            probe-stdout.json
          if-no-files-found: error

  capture:
    name: Capture and validate snapshots
    needs: probe
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_capture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capture (writes to ingest-out/ only; refuses anything it cannot validate)
        continue-on-error: true
        run: python tools/ingest_official.py --capture --out ingest-out | tee capture-report.json
      - name: Prove the fail-closed rule
        run: |
          test -n "$(find ingest-out -name 'slate_official_*.json' -o -name 'injury_report_*.pdf' 2>/dev/null | head -1)" \
            && echo "artefacts written" \
            || { echo "nothing retrieved — no snapshot written, which is the intended behaviour"; exit 0; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingest-out-${{ github.run_id }}
          path: ingest-out
          if-no-files-found: warn

  draft-pr:
    name: Open a draft PR for human integration
    needs: capture
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.open_draft_pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ingest-out-${{ github.run_id }}
          path: payload
      - name: Nothing to propose unless something was captured
        id: check
        run: |
          if [ -n "$(find payload -type f -name '*.json' -o -type f -name '*.pdf' 2>/dev/null | head -1)" ]; then
            echo "has_payload=yes" >> "$GITHUB_OUTPUT"
          else
            echo "has_payload=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.has_payload == 'yes'
      - name: Commit raw artefacts to an ingest branch and open a draft PR
        if: steps.check.outputs.has_payload == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BR="ingest/$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "nba-ingest-bot"
          git config user.email "ingest@users.noreply.github.com"
          git checkout -b "$BR"
          mkdir -p data/raw
          cp -r payload/. data/raw/ingest-$(date -u +%Y-%m-%d)/
          git add data/raw
          git commit -m "ingest: official snapshots captured by workflow ${{ github.run_id }} (raw only)"
          git push -u origin "$BR"
          cat > pr-body.md <<'BODY'
          Raw artefacts captured from the official endpoints by the scheduled ingestion workflow.

          **This PR is deliberately not integrated.** It changes no model input, no data file the site
          reads, and no page. An integration session must re-verify it against the pipeline's provenance
          contract before anything on the site moves. If the captured set is incomplete, the correct
          action is to close it.
          BODY
          gh pr create --draft --base main --title "Ingest ${BR}: raw official snapshots (unintegrated)" --body-file pr-body.md

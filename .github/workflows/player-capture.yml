name: Player game-log capture

# Extends the per-player surface without a human in the loop. Session
# arena/41bd6ce8-nba2 proved the data is reachable and gated it; session
# arena/f8f8f2b8-nba2 showed the official gamebook PDF is the higher-yield source
# (one document per game = every player in that game). This job does both:
#
# * gamebooks mode — for each of the next three slate dates, read the official games
#   index, download one official gamebook PDF per game, and archive each with a
#   sha256. Primary documents only: no rows are parsed out of them here, so nothing
#   unverified enters the repository.
# * players mode — for the clubs on those dates, read the official club page for
#   player ids, then the official game-log page of every player the newest committed
#   injury release designates Out / Doubtful / Questionable (G League rows excluded:
#   a two-way player has no rotation minutes to redistribute). Every parsed player is
#   re-gated before it is written — the mean of its rows must reproduce the
#   PPG / RPG / APG printed in that player's own official header, and every row must
#   carry an official game id. A parse that fails writes nothing and records why.
#
# What it never does:
# * never invents a value — an unreachable page is a recorded capture failure, and a
#   player whose table prints "No data available" is a failure, not a zero;
# * never rewrites data/raw/ledger/** or any committed capture directory;
# * never commits a tree that fails nba2.v2.check (the row-level source gate);
# * never fails the job because nba.com is not answering — an unreachable upstream is
#   reported and nothing is written, so the last good capture stays published.
#
# The first scheduled run is supervised: the parsers were written against the page
# structure observed on 2026-11-15 and tested against fixtures, not live pages.
# A layout change shows up as a capture failure with the reason, never as data.

on:
  schedule:
    # 13:20 ET — after the 11 a.m.–1 p.m. local game-day injury-report window, so the
    # designations the run works from are the ones the clubs actually filed.
    - cron: '20 18 * * *'
    # 21:20 ET — second pass for the clubs that file late.
    - cron: '20 02 * * *'
  workflow_dispatch:
    inputs:
      days_ahead:
        description: 'How many slate dates to capture (1-3)'
        required: false
        default: '3'
      clubs:
        description: 'Optional comma-separated tricodes (default: every club on the slate)'
        required: false
        default: ''
      max_players:
        description: 'Optional cap on players captured this run'
        required: false
        default: '6'

concurrency:
  group: player-capture
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Slate dates to capture (ET, 1..3 days ahead)
        id: dates
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          n = int("${{ github.event.inputs.days_ahead || '3' }}")
          today = datetime.now(ZoneInfo("America/New_York")).date()
          print("dates=" + " ".join(str(today + timedelta(days=i)) for i in range(1, n + 1)))
          PY

      - name: Archive the official gamebook PDFs (primary documents)
        run: |
          set -u
          for d in ${{ steps.dates.outputs.dates }}; do
            echo "== gamebooks $d =="
            python -m nba2.v4.capture --mode gamebooks --date "$d"
          done

      - name: Capture gated per-player game logs
        env:
          CLUBS: ${{ github.event.inputs.clubs }}
          MAXP: ${{ github.event.inputs.max_players }}
        run: |
          set -u
          for d in ${{ steps.dates.outputs.dates }}; do
            args="--mode players --no-injury --date $d"
            [ -n "${CLUBS:-}" ] && args="$args --clubs $CLUBS"
            [ -n "${MAXP:-}" ] && args="$args --max-players $MAXP"
            echo "== players $d =="
            python -m nba2.v4.capture $args
          done

      - name: Measure the capture's gates
        # Fails the job (and blocks the commit below) if any captured player stops
        # reproducing the rates the official page prints for them.
        run: |
          python -m nba2.v4
          python -m unittest discover -s nba2/v4 -t . -p 'test_*.py'

      - name: Rebuild the published trees (v2 -> v3 -> the pages/ mirror)
        run: |
          python -m nba2.v2
          python -m nba2.v3
          python -m nba2.pipeline.build_site
          python -m nba2.v2.check

      - name: Commit if the capture changed anything
        run: |
          git config user.name  "nba2 capture bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- data/raw site pages index.html data/site.json data/site-built.json
          if git diff --cached --quiet; then
            echo "no change — the capture produced nothing new, nothing committed"
            exit 0
          fi
          git commit -m "capture: $(date -u +%Y-%m-%dT%H:%MZ) per-player game logs"
          git push

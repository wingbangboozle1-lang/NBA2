# Capture raw official pages as CI artifacts so parsers are written against real bytes.
#
# WHY: the nightly refresh fails because `nba2/v2/refresh.py` reads stats.nba.com JSON,
# which times out from GitHub runners, while the rendered www.nba.com pages return 200
# (measured: data/raw/egress_probe.json, 2026-11-17T14:28:28Z). Repairing the transport
# means parsing HTML/JSON that we have actually seen — never guessing a page's structure.
# This workflow fetches every page the refresh needs from a runner (the environment that
# must work), records status/bytes/SHA-256 per URL in a manifest, and uploads the raw
# bytes as an artifact. Nothing is committed by this workflow; the session downloads the
# artifact and commits fixtures with their provenance stamps.
#
# Failures are recorded in the manifest, not hidden: an unreachable page shows up as a
# row with ok=false and the exact error, which is evidence either way.

name: Capture official page fixtures

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: page-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch every official page the refresh needs
        run: |
          python3 - <<'PY'
          import datetime as dt, gzip, hashlib, json, pathlib, time, urllib.error, urllib.request

          OUT = pathlib.Path("page_fixtures")
          OUT.mkdir(parents=True, exist_ok=True)
          today = dt.date.today()
          # NOT a browser string: the nightly probe measured 200 from a runner with this
          # self-identifying UA (data/raw/egress_probe.json, 2026-11-17T14:28:28Z), while a
          # Chrome-mimicking UA was challenged on every page. Do not "improve" it without
          # re-measuring: this is the transport the repository is built on.
          ua = {"User-Agent": "NBA2-research-desk/1.0 (endpoint reachability check)",
                "Accept": "*/*", "Referer": "https://official.nba.com/"}

          def urls():
              yield "standings", "https://www.nba.com/standings"
              for i in range(4):                      # slate window: today..today+3
                  d = (today + dt.timedelta(days=i)).isoformat()
                  yield f"schedule_{d}", f"https://www.nba.com/schedule?date={d}"
              for i in range(1, 8):                   # finals lookback: yesterday..7 days ago
                  d = (today - dt.timedelta(days=i)).isoformat()
                  yield f"games_{d}", f"https://www.nba.com/games?date={d}"
              for page in ("traditional", "opponent", "advanced"):
                  yield (f"team_{page}",
                         "https://www.nba.com/stats/teams/" + page +
                         "?Season=2026-27&SeasonType=Regular+Season")
              yield "injury_index", "https://official.nba.com/nba-injury-report-2026-27-season/"
              # control rows: the transports measured unreachable, re-measured every run
              yield "stats_standings_json", ("https://stats.nba.com/stats/leaguestandingsv3"
                                             "?LeagueID=00&Season=2026-27&SeasonType=Regular+Season")
              yield "cdn_scoreboard", ("https://cdn.nba.com/static/json/liveData/scoreboard/"
                                       "todaysScoreboard_00.json")

          rows = []
          for name, url in urls():
              row = {"name": name, "url": url, "retrieved_at_utc": None, "http_status": None,
                     "bytes": None, "sha256": None, "file": None, "ok": False, "error": None,
                     "elapsed_ms": None}
              t0 = time.time()
              try:
                  req = urllib.request.Request(url, headers=ua)
                  with urllib.request.urlopen(req, timeout=25) as r:
                      raw = r.read()
                      if r.headers.get("Content-Encoding") == "gzip":
                          raw = gzip.decompress(raw)
                      row["http_status"] = r.status
                  row["retrieved_at_utc"] = dt.datetime.now(dt.timezone.utc).replace(
                      microsecond=0).isoformat().replace("+00:00", "Z")
                  row["bytes"] = len(raw)
                  row["sha256"] = hashlib.sha256(raw).hexdigest()
                  # control rows are evidence only — never saved as parser fixtures
                  if not name.startswith(("stats_", "cdn_")):
                      path = OUT / f"{name}.html"
                      path.write_bytes(raw)
                      row["file"] = str(path)
                  row["ok"] = True
              except urllib.error.HTTPError as e:
                  row["http_status"] = e.code
                  row["error"] = f"HTTP {e.code}"
                  row["retrieved_at_utc"] = dt.datetime.now(dt.timezone.utc).replace(
                      microsecond=0).isoformat().replace("+00:00", "Z")
              except Exception as e:  # noqa: BLE001 — the error IS the evidence
                  row["error"] = f"{type(e).__name__}: {e}"
                  row["retrieved_at_utc"] = dt.datetime.now(dt.timezone.utc).replace(
                      microsecond=0).isoformat().replace("+00:00", "Z")
              row["elapsed_ms"] = int((time.time() - t0) * 1000)
              rows.append(row)
              print(f"{'OK ' if row['ok'] else 'ERR'} {name:24s} {row['http_status']} "
                    f"{row['bytes']} bytes {row['elapsed_ms']}ms {row['error'] or ''}")

          doc = {
              "schema": "nba2.page-fixtures.v1",
              "captured_by": "capture-fixtures.yml",
              "ref": "${{ github.ref }}",
              "run_id": "${{ github.run_id }}",
              "run_url": f"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "rows": rows,
              "summary": {"n": len(rows), "ok": sum(1 for r in rows if r["ok"]),
                          "unreachable": [r["name"] for r in rows if not r["ok"]]},
          }
          (OUT / "manifest.json").write_text(json.dumps(doc, indent=1) + "\n")
          print(json.dumps(doc["summary"], indent=1))
          lines = ["| page | url | status | bytes | ms | sha256 | error |",
                   "| --- | --- | --- | --- | --- | --- | --- |"]
          for r in rows:
              lines.append(f"| {r['name']} | {r['url']} | {r['http_status']} | {r['bytes']} "
                           f"| {r['elapsed_ms']} | {(r['sha256'] or '')[:12]} | {r['error'] or ''} |")
          pathlib.Path("page_fixtures/SUMMARY.md").write_text(
              "## Official page fixtures\n\n" +
              f"Retrieved at UTC: {rows[0]['retrieved_at_utc']}&nbsp;·&nbsp;"
              f"run: {doc['run_url']}\n\n" + "\n".join(lines) + "\n")
          # a fixture run where the pages the parser depends on are unreachable must be
          # visible; control rows (stats/cdn) are expected to fail and do not fail the job
          critical = [r for r in rows if not r["ok"] and not r["name"].startswith(("stats_", "cdn_"))]
          if critical:
              print("::error::critical official pages unreachable: " +
                    ", ".join(r["name"] for r in critical))
              raise SystemExit(1)
          PY

      - name: Publish the measurement to the job summary
        if: always()
        run: cat page_fixtures/SUMMARY.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload raw fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-fixtures
          path: page_fixtures/
          if-no-files-found: error
          retention-days: 14

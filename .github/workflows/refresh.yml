# Nightly ingest + settlement (audit finding A-01 remediation, v1).
#
# What this job does — and deliberately does not do:
# * ARCHIVES the newest official injury-report PDFs for the sealed-window game dates
#   (data/raw/pdf/**) and cross-checks any committed human transcript against the
#   machine extraction (recall tripwire; a mismatch fails the job).
# * FETCHES official final scores for arrived window dates from NBA endpoints and
#   writes data/raw/finals_*.json snapshots in the exact shape nba2.pipeline.settle
#   expects. If that separate endpoint fails, no score is invented and settlement is
#   skipped; the independently gated rolling-source refresh may still run.
# * SETTLES the sealed ledger only when the official-finals fetch completes successfully.
# * REBUILDS the rolling site only after its own freshness/provenance gates and the full
#   verification chain (unit tests, seal verification, provenance lint) pass.
#
# What it never does:
# * never writes data/raw/ledger/** — the sealed predictions are frozen (verified
#   explicitly before any commit);
# * never creates picks, lines or stakes — promotion still requires the owner;
# * never publishes on a failed rolling-source freshness/provenance gate. A failed
#   settlement fetch leaves the prior settlement stamp untouched, is reported as a warning,
#   and makes the overall workflow fail visibly after any independently gated refresh commit.
#
# Scheduled times (UTC): 14:05 ≈ 09:05 ET (overnight finals), 18:35 ≈ 13:35 ET (after
# the 11 a.m.-1 p.m. local game-day injury-report window). Manual dispatch allowed.

name: Nightly ingest + settlement

on:
  schedule:
    - cron: '5 14 * * *'
    - cron: '35 18 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Window dates from the sealed ledgers
        id: dates
        run: |
          python3 - <<'PY'
          from nba2.pipeline import refresh as RF
          ds = RF.sealed_window_dates()
          print(f"dates={ds[0]}..{ds[-1]} ({len(ds)} game dates, from the sealed ledgers)")
          PY

      - name: Archive newest official injury reports for window dates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from nba2.pipeline import refresh as RF
          # Window = every game date any sealed ledger predicted (arena/6c5195d1, 2026-11-14:
          # previously hardcoded to slate_2026-11-13_to_11-16.json, which silently skipped
          # the 11/17 games sealed in sealed-2026-11-14.json).
          for d in RF.sealed_window_dates():
              rc = RF.cmd_injuries(d, RF.RAW / 'pdf')
              if rc not in (0,):
                  print(f"ingest gate failed for {d} (exit {rc})")
                  sys.exit(rc)
          PY

      - name: Record current settlement data before finals fetch
        id: settlement_before
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          from pathlib import Path
          paths = [Path('data/settlement.json')]
          paths.extend(sorted(Path('data/v4/settlement').glob('settled-*.json')))
          existing = sorted(p for p in paths if p.is_file())
          if not existing:
              print('sha256=missing')
          else:
              digest = hashlib.sha256()
              for p in existing:
                  name = p.as_posix().encode('utf-8')
                  contents = p.read_bytes()
                  digest.update(len(name).to_bytes(8, 'big') + name)
                  digest.update(len(contents).to_bytes(8, 'big') + contents)
              print(f'sha256={digest.hexdigest()}')
          PY

      - name: Fetch official finals for arrived window dates (settlement input)
        id: finals
        # This source has failed before the rolling-slate refresh could run. Treat it as
        # an independent settlement leg: do not guess or settle, but let the rolling official
        # source refresh reach its own fail-closed freshness/provenance gates.
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from nba2.pipeline import refresh as RF
          for date, gids in sorted(RF.window_game_ids_by_date().items()):
            rc = RF.cmd_finals(date, gids, Path(f'data/raw/finals_{date}.json'))
            if rc != 0:
              raise SystemExit(rc)
          rc = RF.cmd_merge_finals()
          if rc != 0:
            raise SystemExit(rc)
          PY

      - name: Cross-check committed transcripts against archived PDFs
        run: |
          set -euo pipefail
          for f in data/raw/injury_report_*.json; do
            python3 -m nba2.pipeline.refresh --verify-transcript "$f"
          done

      - name: Guard — the sealed ledger must be untouched
        run: |
          set -euo pipefail
          git diff --exit-code -- data/raw/ledger || {
            echo "SEALED LEDGER CHANGED during ingest — aborting, committing nothing."
            exit 1
          }
          git diff --cached --exit-code -- data/raw/ledger

      - name: Settle sealed predictions (PENDING until official finals exist)
        if: ${{ steps.finals.outcome == 'success' }}
        run: python3 -m nba2.pipeline.settle

      - name: Preserve the previous settlement stamp when official finals are unavailable
        if: ${{ steps.finals.outcome == 'failure' }}
        run: |
          echo "::warning title=Settlement skipped::official finals were not fetched; no game is graded and the previous verified settlement remains unchanged."
          {
            echo "## Settlement status"
            echo "- **Not refreshed:** the official-finals fetch failed. No score was inferred; the previous verified settlement stamp remains in place."
            echo "- The rolling schedule, standings, team-stat and injury refresh still has to pass its own gates before any site rebuild or commit."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rolling-window ingest — schedule, standings, team stats, injuries (freshness + provenance gates)
        # Per the brief: refresh the four official surfaces for the rolling slate and rebuild the
        # v2 site ONLY if every freshness/provenance gate passes. A failing gate aborts the job
        # before any commit, so the published site can never silently go stale (fail-closed).
        run: python3 -m nba2.v2.refresh --write

      - name: v4 refresh — capture, injury diff, gates, settle, render, check
        # Order is the brief's: store the official reading, diff consecutive injury reports,
        # then run the freshness/provenance gates and only rebuild if they pass. Any gate
        # failure exits non-zero here, before the commit step, so the deployed site stays on
        # the last snapshot that passed rather than silently ageing.
        run: |
          set -euo pipefail
          python3 -m nba2.v4.write_capture
          git diff --exit-code -- data/raw/refresh_2026-11-16 || {
            echo "::error title=capture drifted::the official snapshot no longer reproduces from the committed reading"
            exit 1
          }
          python3 -m nba2.v4.injury_diff
          python3 -m nba2.v4.settlement
          python3 -m nba2.v4
          python3 -m nba2.v4.check

      - name: Verify (unit tests + seal + provenance lint)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s nba2/tests -t .
          python3 -m unittest discover -s nba2/v2 -t . -p 'test_*.py'
          python3 -m unittest discover -s nba2/v4 -t . -p 'test_*.py'
          python3 -m nba2.pipeline.seal_predictions --verify
          python3 -m nba2.pipeline.build_site_data
          python3 -m nba2.pipeline.build_site
          python3 -m nba2.pipeline.lint

      - name: Semantic cross-check (CR-7 — blocking except disclosed legacy-age and README-count checks)
        run: |
          set -uo pipefail
          python3 tools/crosscheck_site.py > /tmp/crosscheck.txt 2>&1 || true
          cat /tmp/crosscheck.txt
          if grep '^\[FAIL\]' /tmp/crosscheck.txt | grep -vE 'CC-FRESH-01|CC-DOC-01'; then
            echo "::error::semantic cross-check failed (failures above) — refusing to commit (CR-7)"
            exit 1
          fi
          echo "cross-check has no blocking semantic failures. CC-FRESH-01 (legacy snapshot age)"
          echo "and CC-DOC-01 (README count drift) are disclosed as non-gating checks; the rolling"
          echo "official-source freshness/provenance gates above remain mandatory."

      - name: Commit refreshed snapshots (only when something changed)
        env:
          FINALS_FETCH_OUTCOME: ${{ steps.finals.outcome }}
          SETTLEMENT_BEFORE_SHA256: ${{ steps.settlement_before.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ "$FINALS_FETCH_OUTCOME" = "failure" ]; then
            current_settlement=$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          paths = [Path('data/settlement.json')]
          paths.extend(sorted(Path('data/v4/settlement').glob('settled-*.json')))
          existing = sorted(p for p in paths if p.is_file())
          if not existing:
              print('missing')
          else:
              digest = hashlib.sha256()
              for p in existing:
                  name = p.as_posix().encode('utf-8')
                  contents = p.read_bytes()
                  digest.update(len(name).to_bytes(8, 'big') + name)
                  digest.update(len(contents).to_bytes(8, 'big') + contents)
              print(digest.hexdigest())
          PY
            )
            if [ "$current_settlement" != "$SETTLEMENT_BEFORE_SHA256" ]; then
              echo "::error title=Settlement changed during failed finals fetch::refusing to commit; prior legacy and v4 settlement files must remain byte-identical when official finals are unavailable."
              exit 1
            fi
            echo "Legacy and v4 settlement data remain byte-identical after unavailable finals fetch."
          fi
          git config user.name "nba2-ingest-bot"
          git config user.email "nba2-ingest-bot@users.noreply.github.com"
          git add data/raw data/v4 site data/settlement.json data/site.json index.html pages 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new from the official sources — no commit."
            exit 0
          fi
          if [ "$FINALS_FETCH_OUTCOME" = "success" ]; then
            refresh_note="official finals fetched and settlement attempted"
          else
            refresh_note="official finals unavailable; prior settlement preserved"
          fi
          git commit -m "ingest(bot): nightly refresh — $refresh_note; rolling freshness/provenance gates passed"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Fail visibly if official settlement data could not be fetched
        if: ${{ always() && steps.finals.outcome == 'failure' }}
        run: |
          echo "::error title=Settlement not refreshed::rolling inputs may have been committed after their own gates, but no result was settled and the prior settlement stamp remains unchanged."
          echo "- **Settlement:** not refreshed; official finals fetch failed and no score was inferred." >> "$GITHUB_STEP_SUMMARY"
          exit 1

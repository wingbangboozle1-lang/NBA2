# Nightly ingest + settlement (audit finding A-01 remediation, v1).
#
# What this job does — and deliberately does not do:
# * ARCHIVES the newest official injury-report PDFs for the sealed-window game dates
#   (data/raw/pdf/**) and cross-checks any committed human transcript against the
#   machine extraction (recall tripwire; a mismatch fails the job).
# * FETCHES official final scores for arrived window dates from NBA endpoints and
#   writes data/raw/finals_*.json snapshots in the exact shape nba2.pipeline.settle
#   expects. A date with no reachable endpoint FAILS the job — nothing is invented.
# * SETTLES the sealed ledger against those finals (data/settlement.json).
# * REBUILDS the site from the refreshed snapshots only after the full verify chain
#   (unit tests, seal verification, provenance lint) passes.
#
# What it never does:
# * never writes data/raw/ledger/** — the sealed predictions are frozen (verified
#   explicitly before any commit);
# * never creates picks, lines or stakes — promotion still requires the owner;
# * never publishes on a failed gate (fail-closed: any subcommand error aborts before
#   the commit step).
#
# Scheduled times (UTC): 14:05 ≈ 09:05 ET (overnight finals), 18:35 ≈ 13:35 ET (after
# the 11 a.m.-1 p.m. local game-day injury-report window). Manual dispatch allowed.

name: Nightly ingest + settlement

on:
  schedule:
    - cron: '5 14 * * *'
    - cron: '35 18 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Window dates from the sealed ledgers
        id: dates
        run: |
          python3 - <<'PY'
          from nba2.pipeline import refresh as RF
          ds = RF.sealed_window_dates()
          print(f"dates={ds[0]}..{ds[-1]} ({len(ds)} game dates, from the sealed ledgers)")
          PY

      - name: Archive newest official injury reports for window dates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from nba2.pipeline import refresh as RF
          # Window = every game date any sealed ledger predicted (arena/6c5195d1, 2026-11-14:
          # previously hardcoded to slate_2026-11-13_to_11-16.json, which silently skipped
          # the 11/17 games sealed in sealed-2026-11-14.json).
          for d in RF.sealed_window_dates():
              rc = RF.cmd_injuries(d, RF.RAW / 'pdf')
              if rc not in (0,):
                  print(f"ingest gate failed for {d} (exit {rc})")
                  sys.exit(rc)
          PY

      - name: Fetch official finals for arrived window dates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from nba2.pipeline import refresh as RF
          for date, gids in sorted(RF.window_game_ids_by_date().items()):
              rc = RF.cmd_finals(date, gids, Path(f'data/raw/finals_{date}.json'))
              if rc != 0:
                  raise SystemExit(rc)
          rc = RF.cmd_merge_finals()
          if rc != 0:
              raise SystemExit(rc)
          PY

      - name: Cross-check committed transcripts against archived PDFs
        run: |
          set -euo pipefail
          for f in data/raw/injury_report_*.json; do
            python3 -m nba2.pipeline.refresh --verify-transcript "$f"
          done

      - name: Guard — the sealed ledger must be untouched
        run: |
          set -euo pipefail
          git diff --exit-code -- data/raw/ledger || {
            echo "SEALED LEDGER CHANGED during ingest — aborting, committing nothing."
            exit 1
          }
          git diff --cached --exit-code -- data/raw/ledger

      - name: Settle sealed predictions (PENDING until official finals exist)
        run: python3 -m nba2.pipeline.settle

      - name: Verify (unit tests + seal + provenance lint)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s nba2/tests -t .
          python3 -m nba2.pipeline.seal_predictions --verify
          python3 -m nba2.pipeline.build_site_data
          python3 -m nba2.pipeline.build_site
          python3 -m nba2.pipeline.lint

      - name: Semantic cross-check (CR-7 — blocking, except snapshot age)
        run: |
          set -uo pipefail
          python3 tools/crosscheck_site.py > /tmp/crosscheck.txt 2>&1 || true
          cat /tmp/crosscheck.txt
          if grep '^\[fail\]' /tmp/crosscheck.txt | grep -v 'CC-FRESH-01'; then
            echo "::error::semantic cross-check failed (failures above) — refusing to commit (CR-7)"
            exit 1
          fi
          echo "cross-check clean. CC-FRESH-01 (snapshot age) is excluded by design: the bot"
          echo "cannot refresh the third-party ratings snapshot, and blocking settlement on it"
          echo "would freeze the ledger's metrics whenever the ratings capture ages."

      # v3 freshness + provenance gates. The brief requires the rebuild to happen only after
      # these pass, so they run as a separate blocking step immediately before the commit step
      # rather than being folded into the cross-check above (whose purpose is different: it
      # compares the site against its committed data, not the data against the official pages).
      #
      # Each gate is a check on the CAPTURE, not on the model. A model result cannot be "stale";
      # a capture can, and a stale capture silently changes every number downstream.
      - name: v3 freshness + provenance gates (blocking, before any rebuild)
        run: |
          set -uo pipefail
          python3 - <<'PY' || { echo "::error::v3 freshness/provenance gate failed — refusing to rebuild or commit"; exit 1; }
          import datetime as dt
          import sys
          from nba2.v3 import official as O
          from nba2.v3 import model as M

          problems = []

          # G-FRESH: the capture must be from today (the job runs twice a day, so a capture more
          # than a day old means the ingest silently stopped working).
          run_date = dt.datetime.now(dt.timezone.utc).date()
          cap_date = dt.date.fromisoformat(O.AS_OF)
          age_days = (run_date - cap_date).days
          print(f"capture AS_OF {O.AS_OF}, retrieved {O.RETRIEVED_UTC}, age {age_days}d")
          if age_days > 1:
              problems.append(f"capture is {age_days} days old — the ingestion path is broken")

          # G-PROVENANCE: every captured surface must name the URL it came from.
          for key, val in O.SOURCES.items():
              url = val[1] if isinstance(val, (list, tuple)) and len(val) > 1 else val
              if not (isinstance(url, str) and url.startswith("https://")):
                  problems.append(f"SOURCE {key} has no https URL: {url!r}")

          # G-ARITHMETIC: the transcription identities. If a capture were mis-transcribed, one of
          # these breaks — which is why they run before the site is rebuilt from it.
          teams = M.load_teams()
          w, l = sum(t.w for t in teams.values()), sum(t.l for t in teams.values())
          if w != l:
              problems.append(f"wins {w} != losses {l}")
          if w != 188:
              problems.append(f"wins {w} != 188 (the season total the capture claims)")
          for tri, t in teams.items():
              if t.gp != t.w + t.l:
                  problems.append(f"{tri}: GP {t.gp} != W+L {t.w + t.l}")
          for gid, _d, _a, _h, ap, hp, aq, hq, _n, _arena in O.FINALS:
              if aq and sum(aq) != ap:
                  problems.append(f"{gid}: away quarters {sum(aq)} != final {ap}")
              if hq and sum(hq) != hp:
                  problems.append(f"{gid}: home quarters {sum(hq)} != final {hp}")

          # G-BLOCKED-SURFACE: with no odds feed, nothing on the bet surface may carry a stake.
          # This is the one gate that must fail the job if it ever stops being true.
          try:
              import json, pathlib
              led = json.loads(pathlib.Path("data/v3/ledger/sealed-picks.json").read_text())
              staked = [p for p in led.get("picks", []) if (p.get("stake_units") or 0) > 0]
              if staked:
                  problems.append(f"{len(staked)} sealed picks carry a stake but G6 reports no market")
          except FileNotFoundError:
              problems.append("data/v3/ledger/sealed-picks.json is missing")

          if problems:
              for p in problems:
                  print(f"  FAIL {p}", file=sys.stderr)
              sys.exit(1)
          print(f"  OK  {len(O.SOURCES)} sources with https URLs, W==L=={w}, "
                f"{len(O.FINALS)} finals sum to their quarters, 0 staked picks")
          PY

      - name: Rebuild the v3 surface (only after the gates above passed)
        run: |
          python3 -m nba2.v3.build
          python3 -m nba2.v3.check

      - name: Commit refreshed snapshots (only when something changed)
        run: |
          set -euo pipefail
          git config user.name "nba2-ingest-bot"
          git config user.email "nba2-ingest-bot@users.noreply.github.com"
          git add data/raw data/settlement.json data/site.json index.html pages 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new from the official sources — no commit."
            exit 0
          fi
          git commit -m "ingest(bot): nightly refresh — official injury releases archived, finals fetched; sealed ledger untouched (verify chain passed)"
          git push origin HEAD:${GITHUB_REF_NAME}

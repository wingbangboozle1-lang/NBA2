# Nightly ingest + settlement, and the gate that decides whether anything is published.
#
# WHY THIS FILE WAS REWRITTEN  (session arena/4f780342-nba2, 2026-11-16)
# ---------------------------------------------------------------------
# The job failed on **5 of 5** scheduled runs (2026-11-14T14:37Z … 2026-11-16T16:06Z). The
# failing step was "Fetch official finals for arrived window dates", and because every later
# step was a plain sequential step, one unreachable third-party endpoint took out all of it:
#
#   * the official injury PDFs that had already been downloaded were never committed
#     (the known F-V4-01 storage gap got worse, not better);
#   * the rolling refresh of schedule / standings / team stats / injuries never ran, so
#     three of the four official surfaces the brief asks for were never refreshed by CI;
#   * the freshness + provenance gates never ran, so nothing could be blocked *or*
#     published — the site simply aged.
#
# Two structural fixes, no new dependencies:
#
#   1. **Each official surface is its own step with `continue-on-error`,** and the failure is
#      recorded as an output. A surface that cannot be reached produces a recorded gap, not a
#      skipped build. This is the brief's "refresh the four surfaces, then rebuild only if the
#      gates pass" — a missing surface is a *gate input*, not a reason to abandon the run.
#   2. **Publishing is decided by one job, `publish`, that `needs:` the capture job and reads
#      a single verdict file.** It rebuilds, and it runs the v2 and v4 gates. If a gate
#      fails, nothing is committed and nothing is deployed — fail-closed — but the *capture*
#      artefacts are still committed under `data/raw/`, because a recorded gap is evidence.
#
# Endpoint reachability is now measured in the repository (`probe-egress.yml` writes
# `data/raw/egress_probe.json`), so "is cdn.nba.com reachable from a runner?" is a fact with a
# timestamp instead of a guess in a commit message.

name: Nightly ingest + settlement

on:
  schedule:
    - cron: '5 14 * * *'   # 09:05 ET — overnight finals, before the morning filing window
    - cron: '35 18 * * *'  # 13:35 ET — after the 11:00-13:00 local game-day window
  workflow_dispatch:

concurrency:
  group: nightly-ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      injuries: ${{ steps.injuries.outcome }}
      finals: ${{ steps.finals.outcome }}
      rolling: ${{ steps.rolling.outcome }}
      v4: ${{ steps.v4.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Which game dates must be covered (derived from the sealed ledgers)
        id: window
        run: |
          python3 - <<'PY'
          from nba2.pipeline import refresh as RF
          ds = RF.sealed_window_dates()
          by_date = RF.window_game_ids_by_date()
          print(f"sealed window: {ds[0]}..{ds[-1]} ({len(ds)} dates)")
          for d in ds:
              print(f"  {d}: {len(by_date.get(d, []))} sealed games")
          PY

      # ---------------------------------------------------------------- surface 1: injuries
      - name: 'Surface 1/4 — archive the official injury reports (+ PDF bytes)'
        id: injuries
        continue-on-error: true
        run: |
          set -uo pipefail
          rc=0
          python3 - <<'PY' || rc=$?
          import sys
          from nba2.pipeline import refresh as RF
          bad = 0
          for d in RF.sealed_window_dates():
              code = RF.cmd_injuries(d, RF.RAW / 'pdf')
              if code not in (0,):
                  print(f"[injuries {d}] exit {code}")
                  bad = code
          sys.exit(bad)
          PY
          echo "--- byte-level archive (CDN reachability is measured, not assumed) ---"
          python3 -m nba2.v4.injury_ingest || echo "::warning::PDF bytes not archived from this runner; see data/v4/injury/binary_manifest.json"
          exit $rc

      # ---------------------------------------------------------------- surface 2: finals
      - name: 'Surface 2/4 — official finals for arrived game dates'
        id: finals
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from nba2.pipeline import refresh as RF
          by_date = RF.window_game_ids_by_date()
          unreachable = []
          for date, gids in sorted(by_date.items()):
              if not gids:
                  print(f"[finals {date}] no sealed-window games — skipped, not an error")
                  continue
              rc = RF.cmd_finals(date, gids, Path(f'data/raw/finals_{date}.json'))
              if rc == 3:
                  unreachable.append(date)      # recorded; do not abort the other surfaces
              elif rc != 0:
                  raise SystemExit(rc)          # a schema change is a real defect: stop
          rc = RF.cmd_merge_finals()
          if rc != 0:
              raise SystemExit(rc)
          if unreachable:
              print(f"::warning title=finals endpoint unreachable::"
                    f"{', '.join(unreachable)} — nothing written for those dates; "
                    f"settlement for them stays PENDING, which is not a loss")
          PY

      # ---------------------------------------------------------------- surface 3+4: rolling
      - name: 'Surfaces 3/4 — rolling slate: schedule, standings, team stats (gated)'
        id: rolling
        continue-on-error: true
        run: |
          set -uo pipefail
          # v2's refresh writes the snapshot and runs its own freshness/provenance gates.
          python3 -m nba2.v2.refresh --write

      # ---------------------------------------------------------------- v4 capture chain
      - name: 'v4 — capture, injury diff, settlement, render'
        id: v4
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 -m nba2.v4.injury_diff
          python3 -m nba2.v4.settlement
          python3 -m nba2.v4

      # ---------------------------------------------------------------- evidence is kept
      - name: Record what each official surface did
        if: always()
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib
          doc = {
            "schema": "nba2.refresh-verdict.v1",
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "run_url": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/"
                       f"{os.environ.get('GITHUB_RUN_ID')}",
            "event": os.environ.get("GITHUB_EVENT_NAME"),
            "attempted_at_utc": dt.datetime.now(dt.timezone.utc).replace(
                microsecond=0).isoformat().replace("+00:00", "Z"),
            "surfaces": {k: os.environ.get(f"OUT_{k.upper()}") for k in
                         ("injuries", "finals", "rolling", "v4")},
            "note": ("'failure' for a surface means its official endpoint was unreachable or "
                     "returned an unexpected schema. Nothing is invented for a failed "
                     "surface: the affected rows stay blank and the settlement rows that "
                     "depend on them stay PENDING. A failed surface blocks PUBLISHING, not "
                     "the recording of the gap."),
          }
          p = pathlib.Path("data/raw/refresh_verdict.json")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(doc, indent=1) + "\n")
          print(json.dumps(doc, indent=1))
          PY
        env:
          OUT_INJURIES: ${{ steps.injuries.outcome }}
          OUT_FINALS: ${{ steps.finals.outcome }}
          OUT_ROLLING: ${{ steps.rolling.outcome }}
          OUT_V4: ${{ steps.v4.outcome }}

      - name: Commit the captured evidence (never the sealed ledgers)
        if: always()
        run: |
          set -uo pipefail
          git config user.name "nba2-ingest-bot"
          git config user.email "nba2-ingest-bot@users.noreply.github.com"
          if ! git diff --exit-code -- data/raw/ledger data/v3/ledger; then
            echo "::error title=sealed ledger changed::a sealed ledger differs from HEAD — refusing to commit anything"
            git checkout -- data/raw/ledger data/v3/ledger
            exit 1
          fi
          git add data/raw data/v4 data/raw/pdf 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new from the official sources — no commit."
            exit 0
          fi
          git commit -m "ingest(bot): official capture — $(date -u +%FT%TZ); sealed ledgers untouched"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  publish:
    # Fail-closed publication: rebuild from the committed capture and run the gates. A gate
    # failure stops here, before the separate Pages workflow can see a new commit.
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Every official surface must have been captured before the site is rebuilt
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("data/raw/refresh_verdict.json")
          if not p.exists():
              print("::error title=no verdict::the capture job left no verdict file; "
                    "refusing to rebuild the site on an unverified capture")
              sys.exit(1)
          v = json.loads(p.read_text())
          s = v["surfaces"]
          print(json.dumps(s, indent=1))
          failed = {k: x for k, x in s.items() if x not in ("success", "skipped")}
          if failed:
              print("::error title=a surface was not captured::" +
                    ", ".join(f"{k}={x}" for k, x in failed.items()) +
                    " — the site is NOT rebuilt, so the last gate-passing snapshot stays live")
              sys.exit(1)
          print("all four surfaces captured")
          PY

      - name: Rebuild every tree from the committed capture
        run: |
          set -euo pipefail
          python3 -m nba2.pipeline.build_site_data
          python3 -m nba2.pipeline.build_site
          python3 -m backtest.engine.build
          python3 -m nba2.v2
          python3 -m nba2.settlement_page
          python3 -m nba2.v3
          python3 -m nba2.v4

      - name: Gate — provenance and freshness on every published tree
        run: |
          set -euo pipefail
          python3 -m nba2.v2.check
          python3 -m nba2.v3.check
          python3 -m nba2.v4.check
          python3 -m nba2.pipeline.lint

      - name: Tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s nba2/tests -t .
          python3 -m unittest discover -s nba2/v2 -t . -p 'test_*.py'
          python3 -m unittest discover -s nba2/v3 -t . -p 'test_*.py'
          python3 -m unittest discover -s nba2/v4 -t . -p 'test_*.py'
          python3 -m nba2.pipeline.seal_predictions --verify

      - name: Semantic cross-check (blocking, except snapshot age)
        run: |
          set -uo pipefail
          python3 tools/crosscheck_site.py > /tmp/crosscheck.txt 2>&1 || true
          cat /tmp/crosscheck.txt
          if grep '^\[fail\]' /tmp/crosscheck.txt | grep -v 'CC-FRESH-01'; then
            echo "::error::semantic cross-check failed — refusing to commit"
            exit 1
          fi

      - name: Commit the rebuild
        run: |
          set -uo pipefail
          git config user.name "nba2-ingest-bot"
          git config user.email "nba2-ingest-bot@users.noreply.github.com"
          git add site data/v2 data/v3 data/v4 data/site.json index.html pages 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "The rebuild matches what is committed — nothing to publish."
            exit 0
          fi
          git commit -m "ingest(bot): gate-passing rebuild of the published tree"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

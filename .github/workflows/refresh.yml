# Nightly ingest + settlement (audit finding A-01 remediation, v1).
#
# What this job does — and deliberately does not do:
# * ARCHIVES the newest official injury-report PDFs for the sealed-window game dates
#   (data/raw/pdf/**) and cross-checks any committed human transcript against the
#   machine extraction (recall tripwire; a mismatch fails the job).
# * FETCHES official final scores for arrived window dates from NBA endpoints and
#   writes data/raw/finals_*.json snapshots in the exact shape nba2.pipeline.settle
#   expects. A date with no reachable endpoint FAILS the job — nothing is invented.
# * SETTLES the sealed ledger against those finals (data/settlement.json).
# * REBUILDS the site from the refreshed snapshots only after the full verify chain
#   (unit tests, seal verification, provenance lint) passes.
#
# What it never does:
# * never writes data/raw/ledger/** — the sealed predictions are frozen (verified
#   explicitly before any commit);
# * never creates picks, lines or stakes — promotion still requires the owner;
# * never publishes refreshed NBA inputs on a failed gate (the snapshot-commit step is
#   skipped and partial runner-local files are discarded);
# * an always-run, main-branch status step publishes only the run outcome and the
#   deterministic v2 status display. It does not stage data/raw, alter sealed picks,
#   or turn a failed refresh into a fresh-model claim.
#
# Scheduled times (UTC): 14:05 ≈ 09:05 ET (overnight finals), 18:35 ≈ 13:35 ET (after
# the 11 a.m.-1 p.m. local game-day injury-report window). Manual dispatch allowed.

name: Nightly ingest + settlement

on:
  schedule:
    - cron: '5 14 * * *'
    - cron: '35 18 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Window dates from the sealed ledgers
        id: dates
        run: |
          python3 - <<'PY'
          from nba2.pipeline import refresh as RF
          ds = RF.sealed_window_dates()
          print(f"dates={ds[0]}..{ds[-1]} ({len(ds)} game dates, from the sealed ledgers)")
          PY

      - name: Archive newest official injury reports for window dates
        id: injury_archive
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from nba2.pipeline import refresh as RF
          # Window = every game date any sealed ledger predicted (arena/6c5195d1, 2026-11-14:
          # previously hardcoded to slate_2026-11-13_to_11-16.json, which silently skipped
          # the 11/17 games sealed in sealed-2026-11-14.json).
          for d in RF.sealed_window_dates():
              rc = RF.cmd_injuries(d, RF.RAW / 'pdf')
              if rc not in (0,):
                  print(f"ingest gate failed for {d} (exit {rc})")
                  sys.exit(rc)
          PY

      - name: Fetch official finals for arrived window dates
        id: finals_fetch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from nba2.pipeline import refresh as RF
          for date, gids in sorted(RF.window_game_ids_by_date().items()):
              rc = RF.cmd_finals(date, gids, Path(f'data/raw/finals_{date}.json'))
              if rc != 0:
                  raise SystemExit(rc)
          rc = RF.cmd_merge_finals()
          if rc != 0:
              raise SystemExit(rc)
          PY

      - name: Cross-check committed transcripts against archived PDFs
        id: transcript_check
        run: |
          set -euo pipefail
          for f in data/raw/injury_report_*.json; do
            python3 -m nba2.pipeline.refresh --verify-transcript "$f"
          done

      - name: Guard — the sealed ledger must be untouched
        id: ledger_guard
        run: |
          set -euo pipefail
          git diff --exit-code -- data/raw/ledger || {
            echo "SEALED LEDGER CHANGED during ingest — aborting, committing nothing."
            exit 1
          }
          git diff --cached --exit-code -- data/raw/ledger

      - name: Settle sealed predictions (PENDING until official finals exist)
        id: settlement
        run: python3 -m nba2.pipeline.settle

      - name: Verify (unit tests + seal + provenance lint)
        id: verify
        run: |
          set -euo pipefail
          python3 -m unittest discover -s nba2/tests -t .
          python3 -m nba2.pipeline.seal_predictions --verify
          python3 -m nba2.pipeline.build_site_data
          python3 -m nba2.pipeline.build_site
          python3 -m nba2.pipeline.lint

      - name: Semantic cross-check (CR-7 — blocking, except snapshot age)
        id: semantic_crosscheck
        run: |
          set -uo pipefail
          python3 tools/crosscheck_site.py > /tmp/crosscheck.txt 2>&1 || true
          cat /tmp/crosscheck.txt
          if grep '^\[fail\]' /tmp/crosscheck.txt | grep -v 'CC-FRESH-01'; then
            echo "::error::semantic cross-check failed (failures above) — refusing to commit (CR-7)"
            exit 1
          fi
          echo "cross-check clean. CC-FRESH-01 (snapshot age) is excluded by design: the bot"
          echo "cannot refresh the third-party ratings snapshot, and blocking settlement on it"
          echo "would freeze the ledger's metrics whenever the ratings capture ages."

      - name: Commit refreshed snapshots (only when something changed)
        id: commit_snapshots
        run: |
          set -euo pipefail
          git config user.name "nba2-ingest-bot"
          git config user.email "nba2-ingest-bot@users.noreply.github.com"
          git add data/raw data/settlement.json data/site.json index.html pages 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new from the official sources — no commit."
            exit 0
          fi
          git commit -m "ingest(bot): nightly refresh — official injury releases archived, finals fetched; sealed ledger untouched (verify chain passed)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Record refresh outcome and publish status (never partial inputs)
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        env:
          RUN_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
          STEP_WINDOW_DATES: ${{ steps.dates.outcome || 'not-run' }}
          STEP_INJURY_ARCHIVE: ${{ steps.injury_archive.outcome || 'not-run' }}
          STEP_FINALS_FETCH: ${{ steps.finals_fetch.outcome || 'not-run' }}
          STEP_TRANSCRIPT_CHECK: ${{ steps.transcript_check.outcome || 'not-run' }}
          STEP_LEDGER_GUARD: ${{ steps.ledger_guard.outcome || 'not-run' }}
          STEP_SETTLEMENT: ${{ steps.settlement.outcome || 'not-run' }}
          STEP_VERIFY: ${{ steps.verify.outcome || 'not-run' }}
          STEP_SEMANTIC_CROSSCHECK: ${{ steps.semantic_crosscheck.outcome || 'not-run' }}
          STEP_COMMIT_SNAPSHOTS: ${{ steps.commit_snapshots.outcome || 'not-run' }}
        run: |
          set -euo pipefail
          # The hosted runner is disposable. A failed snapshot push could leave a local
          # commit at HEAD, so reset to the remote branch (not local HEAD) before status
          # publication; this prevents the status-only push from replaying unpushed NBA inputs.
          # Also discard uncommitted PDFs/finals. This path never stages or commits data/raw.
          git fetch origin "$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          git clean -fd
          python3 -m nba2.v2.refresh_status
          python3 -m nba2.v2
          python3 -m nba2.v2.check
          python3 -m unittest discover -s nba2/v2 -t . -p 'test_*.py'
          git config user.name "nba2-ingest-bot"
          git config user.email "nba2-ingest-bot@users.noreply.github.com"
          git add data/operations/refresh_status.json data/v2 site
          if git diff --cached --quiet; then
            echo "Refresh status and published v2 artefacts are unchanged."
            exit 0
          fi
          git commit -m "status(bot): record refresh outcome ${RUN_STATUS} (#${RUN_ID})"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Verify published data and the verification desk

# TWO JOBS, AND NO DEPLOY ON PURPOSE.
#
# The first version of this workflow uploaded `audit/923eb342/` with
# `actions/upload-pages-artifact` + `deploy-pages`. That took over the repository's Pages root and
# replaced the canonical dashboard with this session's desk (observed: the root URL served the desk
# while `/site/` held the canonical tree). The repository's Pages source is `build_type: legacy`,
# `main /`, so **every committed path is already served** — `audit/923eb342/index.html` is live at
# `/NBA2/audit/923eb342/` the moment it is on `main`, with no deployment at all. Deploying a second
# artefact is therefore both unnecessary and destructive. Removed; the canonical
# `.github/workflows/pages.yml` remains the only thing that deploys this site.
#
# Two jobs, in this order:
#
#   verify  — re-runs this session's line-by-line audit against the official capture and re-runs the
#             repository's own semantic checker. It is informational for the deploy (a finding is a
#             result, not a build error) but it is *not* silent: the whole report is published.
#   build   — regenerates the dashboard from the capture + committed files, checks every link, every
#             row's source and every blank's reason, and fails if any of that is broken or if the
#             committed pages are not a fixed point of a rebuild.
#
# The deployed artefact is `audit/923eb342/` only. This workflow never writes to `site/`, `pages/` or
# `data/` — those belong to the canonical pipeline and to other live sessions (open PRs #130/#131).

on:
  push:
    branches: [main]
    paths:
      - 'audit/923eb342/**'
      - '.github/workflows/verification-desk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-desk
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-run the line-by-line audit (offline part)
        run: |
          python3 audit/923eb342/verify_published.py | tail -3 || true

      - name: The audit harness must run clean
        run: python3 audit/923eb342/verify_published.py > /dev/null

      - name: Repository semantic checker (informational)
        run: |
          python3 tools/crosscheck_site.py | tail -2 || true

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate verified rows and the dashboard
        run: |
          python3 audit/923eb342/ingest.py
          python3 audit/923eb342/build.py

      - name: Check the dashboard (links, per-row sources, reasoned blanks, no placeholders)
        run: python3 audit/923eb342/check.py

      - name: The generator must be a fixed point
        run: |
          git add -A -- audit/923eb342
          if ! git diff --cached --quiet -- audit/923eb342; then
            echo "::error title=dashboard differs from a rebuild::the committed pages are not a fixed point"
            git diff --cached --stat -- audit/923eb342
            exit 1
          fi
          echo "dashboard matches a rebuild of the committed capture"


name: Publish GitHub Pages

# Publishes the v2 site tree (site/). The v1 trees (root *.html, pages/, docs/, dashboard/,
# verified/, originated/) stay in the repository for history but are no longer published:
# they contain snapshots that disagree with each other, and shipping six versions of the
# same dashboard is how a reader learns not to trust any of them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild the v2 site from the committed official snapshot
        run: |
          python -m nba2.v2
          python -m nba2.v2.check

      - name: Fail if the committed site differs from a rebuild
        run: |
          git add -A -- site data/v2
          if git diff --cached --quiet -- site; then
            echo "published artefacts match the v2 model"
            exit 0
          fi
          echo "::error title=site differs::$(git diff --cached --name-only -- site | tr '\n' ' ')"
          git diff --cached --stat -- site | tail -40
          for f in $(git diff --cached --name-only -- site | head -3); do
            echo "=== $f ==="
            git diff --cached -- "$f" | head -40
            echo "::error title=first-diff-in-${f}::$(git diff --cached -- "$f" | sed -n '5,9p' | tr '\n' '|')"
          done
          exit 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

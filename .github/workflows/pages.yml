name: Publish GitHub Pages

# Publishes the v2 site tree (site/). The v1 trees (root *.html, pages/, docs/, dashboard/,
# verified/, originated/) stay in the repository for history but are no longer published:
# they contain snapshots that disagree with each other, and shipping six versions of the
# same dashboard is how a reader learns not to trust any of them.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild the v2 site from the committed official snapshot
        run: |
          python -m nba2.v2
          python -m nba2.v2.check

      - name: Rebuild the v3 rolling-slate pages
        # The v3 pages are written into the same published tree and v3 re-applies its
        # navigation links to the v2 pages, so it has to run after v2 and before the
        # parity diff below, or the diff reports v3's own contribution as drift.
        run: |
          # X-01 (arena/a62b498f-nba2): the settlement page must be written BEFORE the v3 navigation
          # pass, because v3 adds the 'Settlement stamp' link to every page that has a <nav>.
          python -m nba2.settlement_page
          python -m nba2.v3
          python -m nba2.v3.check
          python -m unittest discover -s nba2/v3 -t . -p 'test_*.py'

      - name: Rebuild the v4 gated surfaces (capture -> gate -> render -> settle -> check)
        # The v4 build is fail-closed in two places and both matter for publishing:
        #   * a freshness/provenance gate fails BEFORE rendering, so a stale or unsourced
        #     snapshot cannot reach the tree (the job exits and the deploy is skipped);
        #   * nba2.v4.check then re-verifies the emitted HTML - links, per-row sources,
        #     reasoned blanks, the projection/bet wall, the total = possessions x PPP
        #     identity, the pinned HCA and the settlement hash.
        # It runs last because it appends its own links to the nav that v2 and v3 wrote.
        run: |
          python -m nba2.v4
          python -m nba2.v4.check

      - name: v4 tests
        run: python -m unittest discover -s nba2/v4 -t . -p 'test_*.py'

      - name: Rebuild the v5 player-log pages (transcripts -> gates -> render -> nav)
        # v5 reads the committed official gamebook transcripts (it fetches nothing), runs
        # eight fail-closed gates, renders its four pages and appends its nav block to every
        # page v2/v3/v4 wrote - so it has to run after them. Added with PR #107
        # (session arena/6e46dbf2-nba2); logged in COORDINATION.md as an integration change
        # to a shared build file.
        run: |
          python -m nba2.v5
          python -m unittest discover -s nba2/v5 -t . -p 'test_*.py'

      - name: Build the v8 verification, unknowns and improvement pages
        # v8 renders three pages from the 2026-11-19 official capture
        # (data/raw/verify_2026-11-19/official_2026-11-19.json, produced by the fail-closed parser
        # tools/session-164d832b-capture.py) and appends its own nav block to every page v2..v5
        # wrote. It runs BEFORE v6's grouping pass so the category v6 assigns to those three pages
        # is applied to them (v8 is listed in nba2/v6/nav.py CATEGORIES for exactly that reason).
        # It fetches nothing and it refuses to render if the capture is missing: a page full of
        # holes would otherwise look like a page full of answers.
        run: |
          python -m nba2.v8
          python -m unittest discover -s nba2/v8 -t . -p 'test_*.py'

      - name: Rebuild the v6 measurement pages (inventory -> gates -> render -> nav -> group)
        # v6 fetches nothing: it measures the coverage of what is already committed (injury
        # PDF archive, result feed, player-log coverage, market prior, endpoint
        # reachability), runs thirteen fail-closed gates, renders six pages, injects its nav
        # block and then GROUPS the whole sidebar into categories - so it must run last.
        # Before this step the published tree carried a flat 50-link nav; regrouping is a
        # change to the shared navigation, recorded in COORDINATION.md (session
        # arena/f5ac4e74-nba2, task K-06). Added with the v6 PR.
        run: |
          python -m nba2.v6
          python -m unittest discover -s nba2/v6 -t . -p 'test_*.py'

      - name: Rebuild the v7 originated-slate layer (gates -> render -> nav -> flags)
        # v7 reads the committed transcription in nba2/v7/official.py and the committed
        # official finals under data/raw/ - it fetches nothing. It runs after v6 because it
        # inserts its five links into the sidebar v6 grouped, and re-appends its section to
        # flagged.html because v2 regenerates that page on every rebuild. Its own exit code
        # is a gate: a failing structural check or a lost nav link fails the build rather
        # than silently shipping a broken page. Added on the integration branch
        # arena/585453f5-nba2; the four BLOCKED strategy gates are published, not hidden.
        run: |
          python -m nba2.v7
          python -m unittest discover -s nba2/v7 -t . -p 'test_*.py'

      - name: Fail if the committed site differs from a rebuild
        run: |
          git add -A -- site data/v2 data/v4 data/raw data/v7
          if ! git diff --cached --quiet -- site; then
            echo "::error title=site differs from rebuild::$(git diff --cached --name-only -- site | tr '\n' ' ')"
            git diff --cached --stat -- site | tail -40
            exit 1
          fi
          echo "published artefacts match the v2 model"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Publish GitHub Pages

# ---------------------------------------------------------------------------------------------
# WHAT THIS PUBLISHES
#
# One tree: the canonical dashboard (`index.html` + `pages/**`), the measured-skill backtest it
# links to, and the styles. The list is explicit in `nba2/pipeline/build_public.py` — a new
# top-level directory in the repository cannot become part of the public site by accident.
#
# WHY IT IS NOT "THE REPO ROOT"
#
# This repository contains several site trees from parallel sessions (`site/`, `docs/`,
# `dashboard/`, `originated/`, `verified/`, `archive/`). Publishing all of them put six versions
# of the same dashboard on one domain, and — until this workflow was changed — the workflow
# published `site/` while the repository's Pages setting published the root tree, so a reader
# got a different site from the one CI built. The canonical tree is now named, built and
# link-checked in one place, and the other trees stay in the repository as history, linked as
# source.
#
# The Pages setting for this repository is `build_type: workflow`, so this workflow is the only
# thing that publishes. `nba2/pipeline/build_public.py` fails the job if any internal link in
# the published tree does not resolve.
# ---------------------------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild the published tree from the committed snapshots
        run: |
          python -m nba2.pipeline.build_site_data
          python -m nba2.pipeline.build_site
          python -m backtest.engine.build

      - name: Fail if the committed tree differs from a rebuild
        run: |
          git add -A
          if ! git diff --cached --quiet -- data/site.json '*.html' pages backtest; then
            echo "::error title=site differs from rebuild::$(git diff --cached --name-only -- data/site.json '*.html' pages backtest | tr '\n' ' ')"
            git diff --cached --stat -- data/site.json '*.html' pages backtest | tail -40
            exit 1
          fi
          echo "published artefacts match the pipeline"

      - name: Stage the published tree and prove every internal link resolves
        run: python -m nba2.pipeline.build_public --out _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

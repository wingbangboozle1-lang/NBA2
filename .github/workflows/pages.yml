name: Publish GitHub Pages

# Publishes the v2 site tree (site/). The v1 trees (root *.html, pages/, docs/, dashboard/,
# verified/, originated/) stay in the repository for history but are no longer published:
# they contain snapshots that disagree with each other, and shipping six versions of the
# same dashboard is how a reader learns not to trust any of them.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild the settlement stamp page
        # The settlement page must be written BEFORE the v2 build, because the v2 nav
        # now carries the 'Settlement stamp' link at build time (X-01, done by the
        # final integration session). If it were written afterwards, v2.check would
        # run against a nav that pointed at a page that did not exist yet.
        run: python -m nba2.settlement_page

      - name: Rebuild the v2 site from the committed official snapshot
        run: |
          python -m nba2.v2
          python -m nba2.v2.check

      - name: Rebuild the v3 rolling-slate pages
        # The v3 pages are written into the same published tree and v3 re-applies its
        # navigation links to the v2 pages, so it has to run after v2 and before the
        # parity diff below, or the diff reports v3's own contribution as drift.
        run: |
          python -m nba2.v3
          python -m nba2.v3.check
          python -m unittest discover -s nba2/v3 -t . -p 'test_*.py'

      - name: Rebuild the v4 gated surfaces (capture -> gate -> render -> settle -> check)
        # The v4 build is fail-closed in two places and both matter for publishing:
        #   * a freshness/provenance gate fails BEFORE rendering, so a stale or unsourced
        #     snapshot cannot reach the tree (the job exits and the deploy is skipped);
        #   * nba2.v4.check then re-verifies the emitted HTML - links, per-row sources,
        #     reasoned blanks, the projection/bet wall, the total = possessions x PPP
        #     identity, the pinned HCA and the settlement hash.
        # It runs last because it appends its own links to the nav that v2 and v3 wrote.
        run: |
          python -m nba2.v4
          python -m nba2.v4.check

      - name: v4 tests
        run: python -m unittest discover -s nba2/v4 -t . -p 'test_*.py'

      - name: Fail if the committed site differs from a rebuild
        run: |
          git add -A -- site data/v2 data/v4 data/raw
          if ! git diff --cached --quiet -- site; then
            echo "::error title=site differs from rebuild::$(git diff --cached --name-only -- site | tr '\n' ' ')"
            git diff --cached --stat -- site | tail -40
            exit 1
          fi
          echo "published artefacts match the v2 model"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
